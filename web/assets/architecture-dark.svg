<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="56e6a0-6ae0e7-acf6b7-06c405acba43" role="img" aria-labelledby="architecture-dark.svg-title architecture-dark.svg-desc"><title id="architecture-dark.svg-title">absentia architecture: seven modules, one process</title><desc id="architecture-dark.svg-desc">cli.py resolves arguments and exit codes; ingest.py owns parse boundaries, pages and chunks; variants.py owns the deterministic rewrite dictionary; scan.py owns the FTS5 schema, sentence vectors and max combination; attest.py owns the decision table, core_sha256 and verify; render.py writes a ledger that copies values; mcp_server.py speaks stdio JSON-RPC without an SDK. Artifacts are manifest.json, index.sqlite, attestation.json, ledger.md and two MCP tools. There is no torch, no hosted API and one network egress: the local endpoint the operator names.</desc><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56e6a0"/><stop offset=".55" stop-color="#6ae0e7"/><stop offset="1" stop-color="#acf6b7"/></linearGradient><radialGradient id="halo"><stop stop-color="#56e6a0" stop-opacity="0.2"/><stop offset="1" stop-color="#56e6a0" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#173c2f" stroke-opacity=".5" stroke-width=".7"/></pattern><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#56e6a0" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:8 14;animation:flow 6s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-176}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><rect width="1000" height="620" rx="16" fill="#050c0f"/><rect width="1000" height="620" rx="16" fill="url(#grid)" opacity="0.55"/><ellipse cx="620" cy="223.2" rx="500" ry="372" fill="url(#halo)"/><text x="44" y="44" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">ARCHITECTURE / SEVEN MODULES, ONE PROCESS</text><text x="44" y="82" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="26" fill="#eefdf1" font-weight="400" text-anchor="start" opacity="1">No daemon, no database service, one endpoint</text><text x="40" y="122" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">YOU BRING</text><text x="300" y="122" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">MODULES</text><text x="660" y="122" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">ARTIFACTS</text><rect x="40" y="132" width="210" height="46" rx="12" fill="#0c171b" stroke="#173c2f" stroke-width="1.1" opacity="1"/><text x="54" y="152" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#eefdf1" font-weight="600" text-anchor="start" opacity="1">archive directory</text><text x="54" y="169" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">text-layer PDF/DOCX/TXT/MD</text><path d="M250 155H273V211H296" fill="none" stroke="#56e6a0" stroke-width="1.2" stroke-opacity="0.75" marker-end="url(#arrow)"/><rect x="40" y="188" width="210" height="46" rx="12" fill="#0c171b" stroke="#173c2f" stroke-width="1.1" opacity="1"/><text x="54" y="208" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#eefdf1" font-weight="600" text-anchor="start" opacity="1">a Chinese claim</text><text x="54" y="225" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">plus an optional tau</text><path d="M250 211H273V267H296" fill="none" stroke="#56e6a0" stroke-width="1.2" stroke-opacity="0.75" marker-end="url(#arrow)"/><rect x="40" y="244" width="210" height="46" rx="12" fill="#0c171b" stroke="#173c2f" stroke-width="1.1" opacity="1"/><text x="54" y="264" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#eefdf1" font-weight="600" text-anchor="start" opacity="1">local endpoint</text><text x="54" y="281" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">optional · embeddings only</text><path d="M250 267H273V323H296" fill="none" stroke="#173c2f" stroke-width="1.2" stroke-opacity="0.45" marker-end="url(#arrow)"/><rect x="300" y="132" width="300" height="46" rx="12" fill="#0c171b" stroke="#173c2f" stroke-width="1.1" opacity="1"/><text x="314" y="151" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#56e6a0" font-weight="600" text-anchor="start" opacity="1">cli.py</text><text x="314" y="168" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">typer · arguments · exit codes</text><line x1="600" y1="155" x2="616" y2="155" stroke="#173c2f" stroke-width="1" stroke-opacity="1"/><rect x="300" y="188" width="300" height="46" rx="12" fill="#0c171b" stroke="#173c2f" stroke-width="1.1" opacity="1"/><text x="314" y="207" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#56e6a0" font-weight="600" text-anchor="start" opacity="1">ingest.py</text><text x="314" y="224" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">parse boundaries · pages · chunks</text><line x1="600" y1="211" x2="616" y2="211" stroke="#173c2f" stroke-width="1" stroke-opacity="1"/><rect x="300" y="244" width="300" height="46" rx="12" fill="#0c171b" stroke="#173c2f" stroke-width="1.1" opacity="1"/><text x="314" y="263" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#56e6a0" font-weight="600" text-anchor="start" opacity="1">variants.py</text><text x="314" y="280" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">three rewrite families · deterministic</text><line x1="600" y1="267" x2="616" y2="267" stroke="#173c2f" stroke-width="1" stroke-opacity="1"/><rect x="300" y="300" width="300" height="46" rx="12" fill="#0c171b" stroke="#173c2f" stroke-width="1.1" opacity="1"/><text x="314" y="319" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#56e6a0" font-weight="600" text-anchor="start" opacity="1">scan.py</text><text x="314" y="336" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">FTS5 trigram · vectors · max</text><line x1="600" y1="323" x2="616" y2="323" stroke="#173c2f" stroke-width="1" stroke-opacity="1"/><rect x="300" y="356" width="300" height="46" rx="12" fill="#0c171b" stroke="#56e6a0" stroke-width="1.5" opacity="1"/><text x="314" y="375" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#56e6a0" font-weight="600" text-anchor="start" opacity="1">attest.py</text><text x="314" y="392" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">decision table · core_sha256 · verify</text><line x1="600" y1="379" x2="616" y2="379" stroke="#173c2f" stroke-width="1" stroke-opacity="1"/><rect x="300" y="412" width="300" height="46" rx="12" fill="#0c171b" stroke="#173c2f" stroke-width="1.1" opacity="1"/><text x="314" y="431" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#56e6a0" font-weight="600" text-anchor="start" opacity="1">render.py</text><text x="314" y="448" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">one-page ledger · copies values</text><line x1="600" y1="435" x2="616" y2="435" stroke="#173c2f" stroke-width="1" stroke-opacity="1"/><rect x="300" y="468" width="300" height="46" rx="12" fill="#0c171b" stroke="#173c2f" stroke-width="1.1" opacity="1"/><text x="314" y="487" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#56e6a0" font-weight="600" text-anchor="start" opacity="1">mcp_server.py</text><text x="314" y="504" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">stdio JSON-RPC · no SDK</text><line x1="600" y1="491" x2="616" y2="491" stroke="#173c2f" stroke-width="1" stroke-opacity="1"/><path d="M616 155V491" fill="none" stroke="#173c2f" stroke-width="1"/><rect x="660" y="132" width="300" height="46" rx="12" fill="#0a1718" stroke="#173c2f" stroke-width="1.1" opacity="1"/><text x="674" y="151" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#eefdf1" font-weight="600" text-anchor="start" opacity="1">manifest.json</text><text x="674" y="168" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">sha256 · exclusion ledger</text><path d="M616 155H652" fill="none" stroke="#6ae0e7" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="660" y="188" width="300" height="46" rx="12" fill="#0a1718" stroke="#173c2f" stroke-width="1.1" opacity="1"/><text x="674" y="207" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#eefdf1" font-weight="600" text-anchor="start" opacity="1">index.sqlite</text><text x="674" y="224" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">FTS5 · float32 vectors</text><path d="M616 211H652" fill="none" stroke="#6ae0e7" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="660" y="244" width="300" height="46" rx="12" fill="#0a1718" stroke="#173c2f" stroke-width="1.1" opacity="1"/><text x="674" y="263" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#eefdf1" font-weight="600" text-anchor="start" opacity="1">attestation.json</text><text x="674" y="280" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">core · auxiliary</text><path d="M616 267H652" fill="none" stroke="#6ae0e7" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="660" y="300" width="300" height="46" rx="12" fill="#0a1718" stroke="#173c2f" stroke-width="1.1" opacity="1"/><text x="674" y="319" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#eefdf1" font-weight="600" text-anchor="start" opacity="1">ledger.md</text><text x="674" y="336" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">screenshot-ready page</text><path d="M616 323H652" fill="none" stroke="#6ae0e7" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="660" y="356" width="300" height="46" rx="12" fill="#0a1718" stroke="#173c2f" stroke-width="1.1" opacity="1"/><text x="674" y="375" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#eefdf1" font-weight="600" text-anchor="start" opacity="1">absence_check / absence_verify</text><text x="674" y="392" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">MCP tools</text><path d="M616 379H652" fill="none" stroke="#6ae0e7" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="40" y1="532" x2="960" y2="532" stroke="#173c2f" stroke-width="1" stroke-opacity="1"/><text x="40" y="558" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#eefdf1" font-weight="400" text-anchor="start" opacity="1">One owner per rule: parse boundaries in ingest · rewrite dictionary in variants · scoring formula in scan · decision and digest in attest</text><text x="40" y="580" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#6ae0e7" font-weight="400" text-anchor="start" opacity="1">no torch · no hosted API · the only network egress is the local endpoint you name</text><text x="40" y="602" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">state lives in the manifest, one sqlite index and the output directory</text></svg>
