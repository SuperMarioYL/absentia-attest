<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="56e6a0-6ae0e7-acf6b7-06c405acba43" role="img" aria-labelledby="demo-4-dark.svg-title demo-4-dark.svg-desc"><title id="demo-4-dark.svg-title">verify agrees with the recorded present attestation</title><desc id="demo-4-dark.svg-desc">The second attestation recomputes to PRESENT with exit code 0. The claimed and recomputed core_sha256 both equal 95b4e0734dd926f861c7c027283bef62db4b6840ae057f1f304ecb5d2fd90856. The two checks wrote to .absentia and .absentia-present, so neither overwrote the other.</desc><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56e6a0"/><stop offset=".55" stop-color="#6ae0e7"/><stop offset="1" stop-color="#acf6b7"/></linearGradient><radialGradient id="halo"><stop stop-color="#56e6a0" stop-opacity="0.2"/><stop offset="1" stop-color="#56e6a0" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#173c2f" stroke-opacity=".5" stroke-width=".7"/></pattern><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#56e6a0" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:8 14;animation:flow 6s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-176}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><rect width="760" height="300" rx="16" fill="#050c0f"/><rect width="760" height="300" rx="16" fill="url(#grid)" opacity="0.55"/><ellipse cx="471.2" cy="108" rx="380" ry="180" fill="url(#halo)"/><text x="24" y="30" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">VERIFY / SECOND ATTESTATION, SAME RULES</text><text x="24" y="58" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="20" fill="#eefdf1" font-weight="600" text-anchor="start" opacity="1">Presence recomputes too</text><rect x="24" y="78" width="470" height="196" rx="12" fill="#0c171b" stroke="#173c2f" stroke-width="1.1" opacity="1"/><text x="40" y="104" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="18" fill="#6ae0e7" font-weight="700" text-anchor="start" opacity="1">AGREES</text><text x="40" y="130" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">claimed core_sha256</text><text x="40" y="150" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#eefdf1" font-weight="400" text-anchor="start" opacity="1">95b4e0734dd926f861c7c027283bef62</text><text x="40" y="166" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#eefdf1" font-weight="400" text-anchor="start" opacity="1">db4b6840ae057f1f304ecb5d2fd90856</text><text x="40" y="192" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">recomputed core_sha256</text><text x="40" y="212" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#6ae0e7" font-weight="400" text-anchor="start" opacity="1">95b4e0734dd926f861c7c027283bef62</text><text x="40" y="228" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#6ae0e7" font-weight="400" text-anchor="start" opacity="1">db4b6840ae057f1f304ecb5d2fd90856</text><line x1="40" y1="244" x2="478" y2="244" stroke="#173c2f" stroke-width="1" stroke-opacity="1"/><text x="40" y="262" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#eefdf1" font-weight="400" text-anchor="start" opacity="1">PRESENT → recomputed PRESENT · exit 0</text><rect x="510" y="78" width="226" height="186" rx="12" fill="#0a1718" stroke="#173c2f" stroke-width="1.1" opacity="1"/><text x="528" y="102" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">TWO RUNS, TWO DIRS</text><text x="528" y="134" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#eefdf1" font-weight="400" text-anchor="start" opacity="1">.absentia</text><text x="528" y="152" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">→ INCONCLUSIVE</text><text x="528" y="180" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#eefdf1" font-weight="400" text-anchor="start" opacity="1">.absentia-present</text><text x="528" y="198" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#6ae0e7" font-weight="400" text-anchor="start" opacity="1">→ PRESENT</text><line x1="528" y1="214" x2="720" y2="214" stroke="#173c2f" stroke-width="1" stroke-opacity="1"/><text x="528" y="238" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">neither overwrote</text><text x="528" y="256" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">the other</text><text x="24" y="288" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#95b9b6" font-weight="400" text-anchor="start" opacity="1">the attestation is the same shape for both verdicts; only the numbers and the label change</text></svg>
