      <circle class="dot" cx="957" cy="219" r="2.4"/>
      <circle class="dot" cx="972" cy="217" r="2.4"/>
      <circle class="dot" cx="987" cy="221" r="2.4"/>
      <circle class="dot" cx="1002" cy="213" r="2.4"/>
      <circle class="dot" cx="1017" cy="218" r="2.4"/>
      <circle class="dot" cx="1032" cy="216" r="2.4"/>
      <circle class="dot" cx="1047" cy="220" r="2.4"/>
      <circle class="dot" cx="1062" cy="214" r="2.4"/>
      <circle class="dot" cx="1077" cy="219" r="2.4"/>
      <circle class="dot" cx="1092" cy="217" r="2.4"/>
    </g>

    <text x="784" y="252" class="mono" font-size="9.5" fill="#5d7b93">manifest b59e497d…cf09e</text>
    <text x="784" y="266" class="mono" font-size="9.5" fill="#5d7b93">core 181e3e90…58343</text>
  </g>
</svg>
