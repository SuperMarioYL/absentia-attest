    <text x="1104" y="64" class="mono" font-size="10" text-anchor="end" fill="#6d8ba3">v0.1.0</text>

    <text x="784" y="106" class="brand" font-size="16" fill="#dbeaf5">Flock 摄像头采购</text>
    <text x="784" y="128" class="mono" font-size="11" fill="#f0a35e">INCONCLUSIVE · lexical only</text>

    <line x1="784" y1="196" x2="1104" y2="196" stroke="#2a4258" stroke-width="1"/>
    <line class="march" x1="784" y1="168" x2="1104" y2="168" stroke="#f0a35e" stroke-width="1.2" opacity="0.95"/>
    <text x="1104" y="162" class="mono" font-size="10" text-anchor="end" fill="#f0a35e">τ 0.62</text>
    <text x="784" y="162" class="mono" font-size="10" fill="#6d8ba3">top1 0.25</text>

    <g fill="#4fb6d4">
      <circle class="dot" cx="792" cy="214" r="2.4"/>
